# Cloudflare Workers, built from this GitHub repository. Workers Builds runs the
# build command (`pnpm build`) and then `wrangler deploy`, which uploads `dist`
# as static assets and `worker/index.js` as the small script in front of them.
name = "champollion-docs"
main = "worker/index.js"
# One day behind the calendar on purpose: `wrangler dev`'s bundled workerd
# refuses dates newer than its own build.
compatibility_date = "2026-10-13"

# 🔀 `wrangler deploy` makes the Worker's custom domains match this list: a
# hostname bound only in the dashboard is detached, DNS record and all, by the
# next deploy, so every hostname belongs here before it is bound anywhere else.
# The aqeo.dev zone lives in the same account, so wrangler creates the DNS
# record and the certificate on the first deploy.
routes = [
	{ pattern = "champollion.aqeo.dev", custom_domain = true },
]

[assets]
directory = "./dist"
# The script reaches the built site through this binding.
binding = "ASSETS"
# Starlight writes a 404.html, so an unknown path should serve that page rather
# than the asset-server default.
not_found_handling = "404-page"
# The script may need to answer before the assets server does (the reference
# site negotiates Markdown there), so it runs first.
run_worker_first = true

# 🔭 Observability: logs and traces persist to the Cloudflare dashboard at
# full sampling, and real-time issue detection is on. The dashboard's prompt
# spells the last section `issue_detection`, but wrangler's schema (4.150 and
# 4.151) rejects that name and calls it `issues`; the schema wins, because
# `wrangler deploy` is what Workers Builds runs.
[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issues]
enabled = true
